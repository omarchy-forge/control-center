name: Plugin checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Validate repository structure
        run: |
          jq -e . manifest.json >/dev/null
          bash -n demo/run tests/run tests/runtime
          test -z "$(find . -name .git -prune -o -type l -print -quit)"
